language: ko

reviews:
  auto_review:
    enabled: true
  instructions: |
    이 PR을 리뷰하기 전에 반드시 `testplanning/PL-25324/` 디렉토리의 planning 파일들을 먼저 읽으세요.

    참조해야 할 파일:
    - `testplanning/PL-25324/spec.md`: 요구사항 명세 (Functional Requirements, Success Criteria)
    - `testplanning/PL-25324/plan.md`: 구현 계획 (Implementation Steps, Architecture)
    - `testplanning/PL-25324/tasks.md`: 작업 추적 및 Phase 진행 상황
    - `testplanning/PL-25324/findings.md`: 기술적 결정 사항 및 발견된 이슈

    리뷰 기준:
    - spec.md의 Functional Requirements와 Success Criteria를 충족하는지
    - plan.md의 Implementation Steps와 일치하는 구현인지
    - 불필요한 변경이나 스코프 외 작업이 포함되지 않았는지
